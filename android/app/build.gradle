plugins { id 'com.android.application' }

android {
    namespace 'cz.miraficus.x10connect'
    compileSdk 35
    defaultConfig {
        applicationId 'cz.miraficus.x10connect'
        minSdk 29
        targetSdk 35
        versionCode 7
        versionName '0.3.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        debug {
            if (System.getenv("X10_DEBUG_KEYSTORE")) {
                storeFile file(System.getenv("X10_DEBUG_KEYSTORE"))
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }
    buildTypes {
        release { minifyEnabled false }
    }
    lint { abortOnError true }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.9.3'
    implementation 'androidx.media3:media3-exoplayer-rtsp:1.9.3'
    implementation 'androidx.media3:media3-ui:1.9.3'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
