name: Android APK

on:
  push:
    branches: [android]
    paths: ['android/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:
    inputs:
      publish_preview:
        description: 'Attach APK to the public android-preview prerelease'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      X10_DEBUG_KEYSTORE: ${{ runner.temp }}/x10-signing/debug.keystore
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'android' || github.ref }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Keep preview signing identity between builds
        uses: actions/cache@v4
        with:
          path: ${{ env.X10_DEBUG_KEYSTORE }}
          key: x10-debug-keystore-v2-${{ github.repository_id }}
      - name: Create preview signing key if not cached
        run: |
          if [ ! -f "$X10_DEBUG_KEYSTORE" ]; then
            mkdir -p "$(dirname "$X10_DEBUG_KEYSTORE")"
            keytool -genkeypair -noprompt -keystore "$X10_DEBUG_KEYSTORE" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Test, lint and assemble
        working-directory: android
        run: bash ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Name APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk X10Connect-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: X10Connect-debug-apk
          path: X10Connect-debug.apk
          retention-days: 30
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
      - name: Publish optional preview
        if: github.event_name == 'workflow_dispatch' && inputs.publish_preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view android-preview >/dev/null 2>&1; then
            gh release create android-preview --prerelease --target "$(git rev-parse HEAD)" --title 'X10 Connect — Android preview' --notes 'Unofficial test build for LAMAX X10.1. See android/README.md for tested features and installation.'
          fi
          gh release upload android-preview X10Connect-debug.apk --clobber
